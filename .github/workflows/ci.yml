name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantcare_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check api packages
      # one test checks that resetDb refuses a non-_test database, which must exist
      - run: psql -h localhost -p 5433 -U postgres -c 'CREATE DATABASE plantcare'
        env:
          PGPASSWORD: postgres
      - run: npm run db:test:prepare -w @plantcare/api
      - run: npm test -w @plantcare/shared
      - run: npm test -w @plantcare/api
      - run: npm run build -w @plantcare/api
      - run: npm test -w @plantcare/app
      - run: npx tsc --noEmit
        working-directory: app
